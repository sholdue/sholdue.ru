<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Serif+JP:wght@500;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap');

  :root {
    --text-main: #f3f3f0;
    --text-muted: #a0a0a8;
    --crimson: #d31221;
    --crimson-hover: #ff2a3b;
    --shadow-glow: rgba(0, 0, 0, 0.85);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: url('https://i.pinimg.com/originals/13/cb/81/13cb81ea01b5fb3e05c3e405eadaf2d7.gif') center/cover no-repeat fixed;
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Noto Serif JP', monospace, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page-container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 0 60px 8vw;
  }

  .content-wrapper {
    width: 100%;
    max-width: 380px;
    background: transparent;
    padding: 0;
  }

  section {
    margin-bottom: 38px;
  }

  section:last-child {
    margin-bottom: 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding-bottom: 6px;
    text-shadow: 0 2px 8px var(--shadow-glow);
  }

  .section-num {
    background: var(--crimson);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 6px;
    letter-spacing: 1px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-main);
  }

  .section-jp {
    font-size: 11px;
    color: var(--crimson);
    margin-left: auto;
    letter-spacing: 2px;
    font-weight: bold;
  }

  .link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-item {
    position: relative;
    padding-left: 18px;
    transition: transform 0.15s ease;
  }

  .link-item::before {
    content: "■";
    position: absolute;
    left: 0;
    top: 3px;
    font-size: 7px;
    color: var(--crimson);
    transition: all 0.15s ease;
    text-shadow: 0 0 6px rgba(211, 18, 33, 0.8);
  }

  .link-item:hover {
    transform: translateX(6px);
  }

  .link-item:hover::before {
    color: #ffffff;
    transform: scale(1.4);
  }

  a.main-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: inline-block;
    transition: color 0.15s ease;
    text-shadow: 0 2px 10px var(--shadow-glow), 0 0 2px #000;
  }

  a.main-link:hover {
    color: var(--crimson-hover);
  }

  .meta-tag {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 400;
    text-shadow: 0 1px 6px var(--shadow-glow);
  }

  .discord-box {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    text-shadow: 0 2px 10px var(--shadow-glow);
  }

  .discord-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    border-bottom: 1px dashed var(--crimson);
    transition: all 0.15s ease;
  }

  .discord-box:hover .discord-name {
    color: var(--crimson-hover);
    border-bottom-style: solid;
  }

  .copy-badge {
    font-size: 9px;
    background: var(--crimson);
    color: #fff;
    padding: 2px 6px;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(2px);
    transition: all 0.2s ease;
    font-weight: bold;
  }

  .copy-badge.copied {
    opacity: 1;
    transform: translateY(0);
  }

  .vertical-quote {
    position: fixed;
    right: 6vw;
    bottom: 8vh;
    writing-mode: vertical-rl;
    font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
    font-size: 15px;
    letter-spacing: 0.5em;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 2px 12px var(--shadow-glow), 0 0 4px #000;
    pointer-events: none;
    user-select: none;
    line-height: 2.2;
    z-index: 10;
  }

  .vertical-quote span {
    color: var(--crimson);
    font-weight: bold;
  }

  @media (max-width: 900px) {
    .vertical-quote {
      display: none;
    }
    .page-container {
      padding-left: 6vw;
    }
  }

  @media (max-width: 600px) {
    .page-container {
      padding: 40px 24px;
      justify-content: flex-start;
    }
    .content-wrapper {
      max-width: 100%;
    }
  }
</style>
</head>
<body>

<div class="page-container">
  <div class="content-wrapper">
    
    <!-- Projects Section -->
<!--     <section>
      <div class="section-header">
        <span class="section-num">01</span>
        <h2 class="section-title">Projects</h2>
        <span class="section-jp">計画</span>
      </div>
    </section> -->

    <!-- Links Section -->
    <section>
      <div class="section-header">
        <span class="section-num">01</span>
        <h2 class="section-title">Links</h2>
        <span class="section-jp">連絡先</span>
      </div>
      <ul class="link-list">
        <li class="link-item">
          <a href="https://github.com/sholdue" target="_blank" rel="noopener noreferrer" class="main-link">github</a>
        </li>
        <li class="link-item">
          <a href="https://www.reddit.com/user/Desperate-Unit9812/" target="_blank" rel="noopener noreferrer" class="main-link">reddit</a>
        </li>
        <li class="link-item">
          <div class="discord-box" onclick="copyDiscord(this)">
            <span style="font-size:12px; color:var(--text-muted);">discord:</span>
            <span class="discord-name">sholdue</span>
            <span class="copy-badge">COPIED</span>
          </div>
        </li>
      </ul>
    </section>

  </div>
</div>

<div class="vertical-quote">
  そのやり方が<span>嫌い</span>なら、<br>
  それ以外のやり方を<br>
  いくらだって<span>見つけたらいい</span>。
</div>

<script>
  function copyDiscord(el) {
    const textToCopy = 'sholdue';
    
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(textToCopy);
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = textToCopy;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
    }

    const badge = el.querySelector('.copy-badge');
    if (badge) {
      badge.classList.add('copied');
      setTimeout(() => badge.classList.remove('copied'), 1300);
    }
  }
</script>

</body>
</html>
