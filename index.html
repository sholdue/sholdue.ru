<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sholdue</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/jetbrains-mono-2');

  :root{
    --bg: #0b0b0a;
    --fg: #b9b9b0;
    --dim: #5a5a52;
    --acid: #3ddc84;
    --purple: #a45bff;
    --err: #ff3b3b;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
  }

  body{
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    padding: 60px 20px 100px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: none;
  }

  /* noise texture */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.09;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter>\
<rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grain 0.6s steps(2) infinite;
  }

  /* scanlines */
  body::after{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 3px
    );
    opacity: 0.5;
  }

  @keyframes grain{
    0%   { transform: translate(0,0); }
    50%  { transform: translate(-2%,1%); }
    100% { transform: translate(1%,-1%); }
  }

  @keyframes flicker{
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.82; }
    94% { opacity: 1; }
    95% { opacity: 0.7; }
    96% { opacity: 1; }
  }

  header{
    animation: flicker 6s infinite;
    margin-bottom: 46px;
  }

  h1{
    font-size: 20px;
    color: #eee;
    margin: 0 0 6px 0;
    letter-spacing: 0.5px;
    position: relative;
    display: inline-block;
    text-shadow:
      0 0 1px rgba(61,220,132,0.5),
      2px 0 0 rgba(255,59,59,0.35),
      -2px 0 0 rgba(164,91,255,0.35);
  }

  h1::after{
    content:"_";
    color: var(--acid);
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink{
    50% { opacity: 0; }
  }

  .prompt{ color: var(--dim); }

  .subtitle{
    color: var(--dim);
    font-size: 12px;
    display: block;
    letter-spacing: 0.5px;
  }

  .subtitle .sep{ color: #333; margin: 0 4px; }

  h2{
    font-size: 11px;
    color: var(--acid);
    text-transform: uppercase;
    margin: 0 0 16px 0;
    letter-spacing: 2px;
    opacity: 0.9;
  }

  h2::before{
    content: "// ";
    color: #2a5a3d;
  }

  section{ margin-bottom: 46px; }

  ul{ list-style:none; padding:0; margin:0; }

  li{
    margin-bottom: 14px;
    position: relative;
    padding-left: 14px;
    border-left: 1px solid #1e1e1a;
  }

  li::before{
    content: "";
    position: absolute;
    left: -1px;
    top: 0;
    height: 0%;
    width: 1px;
    background: var(--acid);
    transition: height 0.25s ease;
  }

  li:hover::before{ height: 100%; }

  a{
    color: var(--fg);
    text-decoration: none;
    display: inline-block;
    position: relative;
  }

  a:hover{
    color: var(--acid);
  }

  a:hover::before{
    content: attr(data-glitch);
    position: absolute;
    left: 1px;
    top: 0;
    color: var(--err);
    opacity: 0.6;
    clip-path: inset(0 0 55% 0);
    animation: glitchshift 0.4s steps(2) infinite;
  }

  a:hover::after{
    content: attr(data-glitch);
    position: absolute;
    left: -1px;
    top: 0;
    color: var(--purple);
    opacity: 0.6;
    clip-path: inset(55% 0 0 0);
    animation: glitchshift 0.5s steps(2) infinite reverse;
  }

  @keyframes glitchshift{
    0%   { transform: translate(0,0); }
    50%  { transform: translate(1px,0); }
    100% { transform: translate(-1px,0); }
  }

  .desc{
    color: var(--dim);
    font-size: 11px;
    display: block;
    margin-top: 2px;
  }

  .discord{ color: var(--purple); cursor: pointer; }
  .discord:hover{ text-decoration: underline; }

  .copied{
    color: var(--acid);
    font-size: 10px;
    margin-left: 6px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .copied.show{ opacity: 1; }

  footer{
    color: #2f2f2a;
    font-size: 10px;
    margin-top: 60px;
    letter-spacing: 1px;
  }

  ::selection{
    background: var(--acid);
    color: #000;
  }
</style>
</head>
<body>

  <header>
    <h1>sholdue</h1>
    <span class="subtitle">dev<span class="sep">/</span>gdscript<span class="sep">·</span>ts<span class="sep">·</span>js</span>
  </header>

  <section>
    <h2>projects</h2>
    <ul>
      <li>
        <a href="https://discord.gg/5zUNqN8qct" target="_blank" rel="noopener noreferrer" data-glitch="make me sad">make me sad</a>
        <span class="desc">game</span>
      </li>
      <li>
        <a href="https://store.steampowered.com/app/2824230/last_seen_online/" target="_blank" rel="noopener noreferrer" data-glitch="last_seen_online">last_seen_online</a>
        <span class="desc">ru/ua localization</span>
      </li>
      <li>
        <a href="https://github.com/bazelik-null/ENAbbq_rus" target="_blank" rel="noopener noreferrer" data-glitch="ena: dream bbq">ena: dream bbq</a>
        <span class="desc">russian language patch</span>
      </li>
    </ul>
  </section>

  <section>
    <h2>links</h2>
    <ul>
      <li><a href="https://github.com/sholdue" target="_blank" rel="noopener noreferrer" data-glitch="github">github</a></li>
      <li><a href="https://www.reddit.com/user/Desperate-Unit9812/" target="_blank" rel="noopener noreferrer" data-glitch="reddit">reddit</a></li>
      <li>
        discord: <span class="discord" onclick="copyDiscord(this)">sholdue</span>
        <span class="copied">copied</span>
      </li>
    </ul>
  </section>

  <footer><span class="prompt">&gt;</span> #brgzwillfind</footer>

<script>
  function copyDiscord(el){
    navigator.clipboard.writeText('sholdue');
    const note = el.parentElement.querySelector('.copied');
    note.classList.add('show');
    setTimeout(()=> note.classList.remove('show'), 1200);
  }
</script>

</body>
</html>
